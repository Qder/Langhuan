<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>粘贴用富文本片段</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 40rem; margin: 2rem auto; line-height: 1.6; }
    h1 { color: #b3382a; }
    a { color: #2f5d57; }
  </style>
</head>
<body>
  <h1>琅嬛剪藏练习</h1>
  <p>这是一段<strong>富文本</strong>示例，用来检验 Turndown：复制后应变成干净的 Markdown。</p>
  <h2>要点列表</h2>
  <ul>
    <li>一级标题与二级标题保留层级</li>
    <li>列表项变成 <code>-</code> 或有序列表</li>
    <li>链接变成 <a href="https://github.com/Qder/Langhuan">Markdown 链接</a></li>
  </ul>
  <ol>
    <li>在浏览器打开本文件</li>
    <li>全选并复制</li>
    <li>回到琅嬛按「粘贴说明」操作</li>
  </ol>
  <blockquote>引用块也应尽量保留。</blockquote>
</body>
</html>
