[package]
name = "langhuan"
version = "0.1.0"
description = "琅嬛 · 私人藏书阁"
authors = ["Qder"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
rand = "0.8"
# 桌面版讲解的 HTTP 通路：只连用户自己配置的 OpenAI 兼容端点。
# `native-tls` 走系统 TLS（Windows = SChannel），不需要 cmake/Perl，也避免把
# aws-lc-rs 这种要本地编译的加密栈拉进安装包。
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
  "charset",
  "http2",
] }
