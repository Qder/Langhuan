[package]
name = "langhuan"
version = "0.1.0"
description = "琅嬛 · 私人藏书阁"
authors = ["Qder"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
rand = "0.8"
