[package]
name = "langhuan"
version = "0.1.0"
description = "琅嬛 · 私人藏书阁"
authors = ["Qder"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Desktop + Android release .so: drop symbols. Debug APK stays huge on purpose.
[profile.release]
strip = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"

# 桌面版讲解的 HTTP 通路：只连用户自己配置的 OpenAI 兼容端点。
# Windows 用 `native-tls`（SChannel），避开 cmake/Perl 和 aws-lc-rs。
# Android 没有可用的系统 TLS crate 组合，改 rustls。
[target.'cfg(not(target_os = "android"))'.dependencies]
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "native-tls",
  "charset",
  "http2",
] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "android")'.dependencies]
# 不用 http2：部分网关 / rustls 握手会空等到超时；电脑浏览器 Next 走 HTTP/1.1 所以通。
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "stream",
  "rustls",
  "charset",
  "system-proxy",
] }
